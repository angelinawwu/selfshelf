name: SelfShelf
options:
  bundleIdPrefix: com.angelinawu.selfshelf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CODE_SIGN_STYLE: Automatic

targets:
  SelfShelf:
    type: application
    platform: iOS
    sources:
      - path: SelfShelf
      - path: SelfShelfKit
    resources:
      - path: SelfShelf/Resources/Fonts
    info:
      path: SelfShelf/Info.plist
      properties:
        CFBundleDisplayName: SelfShelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Sentient-Light.otf
          - Archivo-Light.ttf
          - Archivo-Italic.ttf
          - PTMono-Regular.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.angelinawu.selfshelf.app
            CFBundleURLSchemes:
              - selfshelf
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            openlibrary.org:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
            covers.openlibrary.org:
              NSExceptionAllowsInsecureHTTPLoads: false
    entitlements:
      path: SelfShelf/SelfShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.angelinawu.selfshelf.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angelinawu.selfshelf.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: '"SelfShelf/Preview Content"'
    dependencies:
      - target: SelfShelfWidget

  SelfShelfWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SelfShelfWidget
      - path: SelfShelfKit
    resources:
      - path: SelfShelf/Resources/Fonts
    info:
      path: SelfShelfWidget/Info.plist
      properties:
        CFBundleDisplayName: SelfShelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Sentient-Light.otf
          - Archivo-Light.ttf
          - Archivo-Italic.ttf
          - PTMono-Regular.ttf
    entitlements:
      path: SelfShelfWidget/SelfShelfWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.angelinawu.selfshelf.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angelinawu.selfshelf.app.Widget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
